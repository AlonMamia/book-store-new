name: CI - Prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test --silent
      - name: Build
        run: npm run build --if-present
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Replace with actual production deployment steps (cloud CLI, SSH, etc.)
        env:
          NODE_ENV: production
